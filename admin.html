<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin NCS-CORPORATION-SRL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f9fa;color:#111827;font-family:Inter,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo-img{width:40px;height:40px;border-radius:50%;display:block;filter:drop-shadow(0 3px 8px rgba(230,51,41,.25))}
h1{font-size:22px;margin:0;color:#e63329}
main{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:380px 1fr;gap:20px}
section{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:18px}
label{display:block;font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:10px;font:inherit;background:#fff}
textarea{min-height:84px;resize:vertical}
button{border:0;border-radius:6px;padding:11px 14px;font-weight:800;cursor:pointer;background:#e63329;color:#fff}
button.secondary{background:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:14px}
.status{font-size:13px;color:#6b7280;margin-top:12px}
.products{display:grid;gap:10px}
.product{border:1px solid #e5e7eb;border-radius:8px;padding:12px;display:grid;grid-template-columns:64px 1fr auto auto;gap:12px;align-items:center;background:#fff}
.product.inactive{opacity:.55;background:#f3f4f6}
.product img{width:64px;height:52px;object-fit:contain;background:#f3f4f6;border-radius:6px;cursor:pointer}
.product strong{display:block}
.product .clickable{cursor:pointer}
.tag-oculto{font-size:10px;font-weight:800;color:#fff;background:#6b7280;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.muted{color:#6b7280;font-size:13px}
.stock{font-weight:800}
.stock.ok{color:#12b76a}.stock.low{color:#f59e0b}.stock.empty{color:#e63329}
.product-actions{display:flex;flex-direction:column;gap:6px}
.mini{background:#fff;color:#111827;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:#111827}
.mini.danger{color:#e63329;border-color:#e63329}
.mini.danger:hover{background:#e63329;color:#fff}
@media(max-width:860px){main{grid-template-columns:1fr}}
</style>
</head>

<main>
  <section>
    <h2>Producto</h2>
    <label>URL Apps Script</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Token admin (opcional)</label>
    <input id="adminToken" placeholder="Solo si configuraste ADMIN_TOKEN en el script">
    <p class="muted" style="margin-top:6px">La lista de la derecha muestra todos los productos, incluidos los ocultos.</p>

    <label>Codigo OEM</label>
    <input id="oem" placeholder="Ej. 11115-21030">

    <label>Codigo alterno</label>
    <input id="alterno" placeholder="Codigo alterno / equivalente">

    <div class="row">
      <div><label>Marca</label><input id="marca" placeholder="Toyota"></div>
      <div><label>Origen</label><input id="origen" placeholder="Japon, Taiwan, Brasil..."></div>
    </div>

    <label>Descripcion</label>
    <textarea id="descripcion" placeholder="Descripcion del repuesto: nombre, aplicacion, detalles."></textarea>

    <label>Categoria</label>
    <input id="categoria" placeholder="Ej. juntas, correas, bombas, frenos...">

    <label>Medida</label>
    <input id="medida" placeholder="Ej. 35x50x8">

    <div class="row">
      <div><label>Precio BOB</label><input id="precio" type="number" step="0.01" placeholder="0.00"></div>
      <div><label>Cantidad</label><input id="cantidad_stock" type="number" step="1" placeholder="0"></div>
    </div>
    <p class="muted" style="margin-top:4px">El catalogo calcula solo el equivalente en USD usando el tipo de cambio (recuadro TC de arriba). No hace falta cargar el precio en dolares.</p>

    <label>Imagen del producto</label>
    <input id="imageFile" type="file" accept="image/*">
    <input id="imagen_url" placeholder="Se llena sola al subir, o pega una URL de imagen">
    <div id="imgPreviewWrap" style="margin-top:8px;display:none">
      <img id="imgPreview" alt="Vista previa" style="max-width:100%;max-height:160px;border:1px solid #e5e7eb;border-radius:6px;background:#f3f4f6">
    </div>

    <div class="actions">
      <button id="saveBtn" onclick="saveProduct()">Guardar</button>
      <button class="secondary" onclick="clearForm()">Nuevo</button>
    </div>
    <div class="status" id="status">Listo.</div>
  </section>

  <section>
    <h2>Productos en hoja</h2>
    <div style="display:flex;align-items:center;gap:8px;background:#fff5f4;border:1px solid #e63329;border-radius:8px;padding:10px 12px;margin-bottom:14px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:800;color:#e63329;text-transform:uppercase;white-space:nowrap">TC USD&nbsp;&rarr;&nbsp;BOB</span>
      <input id="tcInput" type="number" step="0.01" min="0" placeholder="12.10" style="max-width:110px">
      <button class="mini" onclick="guardarTipoCambio()">Guardar</button>
      <span class="muted" id="tcStatus" style="margin-left:auto"></span>
    </div>
    <input id="searchAdmin" type="text" placeholder="Buscar por OEM, descripcion, marca..." style="margin-bottom:12px" oninput="filtrarProductos()">
    <div class="products" id="products"></div>
  </section>
</main>

<script>
const fields = ['oem','alterno','origen','marca','descripcion','categoria','medida','precio','cantidad_stock','imagen_url'];
const apiInput = document.getElementById('apiUrl');
apiInput.value = localStorage.getItem('ncsApiUrl') || '';
apiInput.addEventListener('change',()=>localStorage.setItem('ncsApiUrl', apiInput.value.trim()));

const tokenInput = document.getElementById('adminToken');
tokenInput.value = localStorage.getItem('ncsAdminToken') || '';
tokenInput.addEventListener('change',()=>localStorage.setItem('ncsAdminToken', tokenInput.value.trim()));

function apiUrl(){
  const url = apiInput.value.trim();
  if(!url) throw new Error('Pega la URL de Apps Script.');
  localStorage.setItem('ncsApiUrl', url);
  return url;
}

function escapeAttr(value){
  return String(value ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// Convierte cualquier formato de enlace de Google Drive en una URL que SI
// carga dentro de <img>. Si no es de Drive, devuelve la URL tal cual.
// Convierte cualquier formato de enlace de Google Drive en una URL que SI
// carga dentro de <img>. Si no es de Drive, devuelve la URL tal cual.
function driveFileId(url){
  url = String(url || '');
  let m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/)
       || url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/)
       || url.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]{20,})/);
  return m ? m[1] : '';
}
function driveImg(url){
  url = String(url || '').trim();
  if(!url) return '';
  if(url.startsWith('data:')) return url; // vista previa local (base64)
  const id = driveFileId(url);
  if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
  return url;
}

function setStatus(msg){document.getElementById('status').textContent = msg}

async function post(payload){
  const token = tokenInput.value.trim();
  if(token) payload.token = token;
  let res;
  try{
    res = await fetch(apiUrl(), {
      method:'POST',
      // IMPORTANTE: con 'text/plain' el navegador NO dispara la peticion
      // preflight OPTIONS, que Apps Script no sabe responder y que es la
      // causa #1 de que "no conecte". El backend igual lee el body como JSON.
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),
      redirect:'follow'
    });
  }catch(err){
    throw new Error('No se pudo conectar con Apps Script. Revisa tu internet y que la URL termine en /exec.');
  }
  const text = await res.text();
  try{
    return JSON.parse(text);
  }catch(_){
    throw new Error('Apps Script no devolvio JSON. Verifica que la implementacion sea "Cualquier usuario" y vuelve a implementar una nueva version.');
  }
}

async function uploadImageIfNeeded(){
  const file = document.getElementById('imageFile').files[0];
  if(!file) return document.getElementById('imagen_url').value.trim();
  if(file.size > 4 * 1024 * 1024) throw new Error('La imagen es muy pesada. Usa una imagen menor a 4 MB.');
  setStatus('Subiendo imagen...');
  const dataUrl = await new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const uploaded = await post({action:'uploadImage', filename:file.name, mimeType:file.type, dataUrl});
  if(!uploaded.ok) throw new Error(uploaded.error || 'No se pudo subir imagen.');
  document.getElementById('imagen_url').value = uploaded.url;
  return uploaded.url;
}

async function saveProduct(){
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn) saveBtn.disabled = true;
  try{
    const imagen_url = await uploadImageIfNeeded();
    const product = Object.fromEntries(fields.map(id=>[id, document.getElementById(id).value.trim()]));
    product.imagen_url = imagen_url;
    product.id = product.oem;
    if(!product.id) throw new Error('Falta el codigo OEM (es el identificador del producto).');
    product.activo = 'SI';
    setStatus('Guardando...');
    const saved = await post({action:'upsert', product});
    if(!saved.ok) throw new Error(saved.error || 'No se pudo guardar.');
    setStatus('Producto guardado. Aparecera en el catalogo en pocos segundos.');
    await loadProducts();
  }catch(error){
    console.error(error);
    setStatus(error.message);
  }finally{
    if(saveBtn) saveBtn.disabled = false;
  }
}

let allProducts = [];

function filtrarProductos(){
  const q = document.getElementById('searchAdmin').value.toLowerCase().trim();
  const filtered = q ? allProducts.filter(p =>
    Object.values(p).join(' ').toLowerCase().includes(q)
  ) : allProducts;
  renderProducts(filtered);
}

function renderProducts(products){
  document.getElementById('products').innerHTML = products.map(p=>{
    const stock = Number(p.cantidad_stock || 0);
    const stockClass = stock <= 0 ? 'empty' : stock < 10 ? 'low' : 'ok';
    const inactive = String(p.activo || 'SI').toUpperCase() === 'NO';
    const safeJson = JSON.stringify(p).replace(/'/g,'&#039;');
    const safeId = escapeAttr(p.id);
    return `<div class="product ${inactive?'inactive':''}">
      <img class="clickable" src="${driveImg(p.imagen_url)}" alt="" onclick='editProduct(${safeJson})' onerror="this.style.visibility='hidden'">
      <span class="clickable" onclick='editProduct(${safeJson})'>
        <strong>${p.oem || p.id}${inactive?'<span class="tag-oculto">OCULTO</span>':''}</strong>
        <span class="muted">${p.descripcion || ''}</span>
        <span class="muted">${[p.marca, p.medida, p.origen].filter(Boolean).join(' · ')}</span>
      </span>
      <span class="stock ${stockClass}">${stock} und.</span>
      <div class="product-actions">
        <button class="mini" onclick="toggleActive('${safeId}')">${inactive?'Mostrar':'Ocultar'}</button>
        <button class="mini danger" onclick="deleteProduct('${safeId}')">Eliminar</button>
      </div>
    </div>`;
  }).join('') || '<p class="muted">No se encontraron productos.</p>';
}

async function loadProducts(){
  try{
    const res = await fetch(`${apiUrl()}?action=admin_list&t=${Date.now()}`, {cache:'no-store'});
    const data = await res.json();
    const products = data.products || [];
    allProducts = products;
    filtrarProductos();
    if(data.tipo_cambio) document.getElementById('tcInput').value = data.tipo_cambio;
    setStatus('Lista actualizada.');
  }catch(error){
    console.error(error);
    setStatus(error.message);
  }
}

// Guarda el tipo de cambio (recuadro "TC" del catalogo publico). Se guarda en
// Apps Script (PropertiesService), no en la hoja de productos, y se ve igual
// para todos los visitantes en cuanto el catalogo vuelva a sincronizar.
async function guardarTipoCambio(){
  const tcStatus = document.getElementById('tcStatus');
  const valor = document.getElementById('tcInput').value.trim();
  if(!valor || Number(valor) <= 0){
    tcStatus.textContent = 'Ingresa un numero valido.';
    return;
  }
  try{
    tcStatus.textContent = 'Guardando...';
    const res = await post({action:'settipocambio', valor});
    if(!res.ok) throw new Error(res.error || 'No se pudo guardar.');
    tcStatus.textContent = 'Guardado. Se vera en el catalogo en pocos segundos.';
  }catch(error){
    console.error(error);
    tcStatus.textContent = error.message;
  }
}

async function toggleActive(id){
  try{
    setStatus('Actualizando visibilidad...');
    const res = await post({action:'toggleActive', id});
    if(!res.ok) throw new Error(res.error || 'No se pudo actualizar.');
    setStatus(res.activo === 'NO' ? 'Producto ocultado del catalogo.' : 'Producto visible en el catalogo.');
    await loadProducts();
  }catch(error){
    console.error(error);
    setStatus(error.message);
  }
}

async function deleteProduct(id){
  if(!confirm('Esto borra el producto definitivamente de la hoja de calculo. ¿Continuar?')) return;
  try{
    setStatus('Eliminando...');
    const res = await post({action:'delete', id});
    if(!res.ok) throw new Error(res.error || 'No se pudo eliminar.');
    setStatus('Producto eliminado.');
    await loadProducts();
  }catch(error){
    console.error(error);
    setStatus(error.message);
  }
}

function showPreview(url){
  const wrap = document.getElementById('imgPreviewWrap');
  const img = document.getElementById('imgPreview');
  const finalUrl = driveImg(url);
  if(finalUrl){ img.src = finalUrl; wrap.style.display = 'block'; }
  else { img.removeAttribute('src'); wrap.style.display = 'none'; }
}

function editProduct(product){
  fields.forEach(id=>document.getElementById(id).value = product[id] || '');
  document.getElementById('imageFile').value = '';
  showPreview(product.imagen_url);
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearForm(){
  fields.forEach(id=>document.getElementById(id).value = '');
  document.getElementById('imageFile').value = '';
  showPreview('');
  setStatus('Formulario limpio.');
}

// Vista previa instantanea al elegir un archivo o al pegar una URL.
document.getElementById('imageFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>showPreview(reader.result);
  reader.readAsDataURL(file);
});
document.getElementById('imagen_url').addEventListener('input', e=>showPreview(e.target.value));
</script>
